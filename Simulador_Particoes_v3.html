<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador de Partições</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: projeção em sala. Cabeçalho com os modos; no centro, fila | memória vertical (como nas figuras do livro) | painel do modo; embaixo, explicação, contadores e controles. Tema claro único, de propósito. */
:root{
  color-scheme:light;
  --bg:#f2f2f0; --paper:#ffffff; --ink:#111111; --ink2:#4a4a4a; --rule:#c9c9c4; --so:#8c8c8c;
  --A:#2E75B6; --B:#548235; --C:#C55A11; --D:#7030A0; --E:#A8325E; --F:#1F6F78;
  --waste:#c00000; --mark:#3B1E5E; --roxo:#3B1E5E; --hl:#FFC000;
  --sans:"Segoe UI",Arial,Helvetica,sans-serif;
  --mono:Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:21px;line-height:1.35;overflow:hidden}
/* palco fixo 1600x900 (16:9), escalado por script para caber inteiro em qualquer tela */
.app{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;display:grid;grid-template-rows:auto 1fr auto;gap:12px;
  padding:14px 22px;background:var(--bg)}
button,select{font:inherit;cursor:pointer;color:var(--ink);background:var(--paper)}
button:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
/* header */
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;border-bottom:3px solid var(--roxo);padding-bottom:12px}
header h1{font-size:1.15em;margin:0;font-weight:700;letter-spacing:.01em;margin-right:6px}
header h1 small{display:block;font-size:.62em;font-weight:400;color:var(--ink2)}
.modes{display:flex;flex-wrap:wrap;gap:6px}
.modes button{border:2px solid var(--roxo);background:var(--paper);color:var(--roxo);padding:.3em .8em;border-radius:0;font-size:.85em;font-weight:600}
.modes button .d,.sub button .d{font-size:.66em;color:var(--ink2);font-weight:400;white-space:nowrap}
.modes button:hover,.sub button:hover,.ctrls button:hover:not(:disabled){background:#ece6f3}
.modes button[aria-pressed="true"],.modes button[aria-pressed="true"]:hover{background:var(--roxo);color:#fff;font-weight:700;box-shadow:0 6px 0 0 var(--hl)}
.modes button[aria-pressed="true"] .d,.sub button[aria-pressed="true"] .d{color:#e8e8e8}
.modes button .k{font-family:var(--mono);font-size:.8em;opacity:.7;margin-right:.3em}
.sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.sub[hidden]{display:none!important}
.sub button{border:2px solid var(--roxo);background:var(--paper);color:var(--roxo);padding:.2em .7em;border-radius:0;font-size:.8em;font-weight:600}
.sub button[aria-pressed="true"],.sub button[aria-pressed="true"]:hover{background:var(--roxo);color:#fff;font-weight:700;box-shadow:0 5px 0 0 var(--hl)}
/* stage */
.stage{display:grid;grid-template-columns:1fr 600px 1fr;gap:28px;min-height:0;align-items:stretch;justify-content:center;width:100%}
.stage.cmp{grid-template-columns:repeat(3,420px);gap:48px;justify-content:center}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
.col h2{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px;color:var(--ink2);font-weight:700}
.colbody{flex:1;min-height:0;position:relative}
/* memory */
.memwrap{display:grid;grid-template-columns:3.2em 1fr;height:100%;min-height:0;padding-right:var(--pr,0)}
.memwrap.parted{--pr:6.5em}
.addr{position:relative;font-family:var(--mono);font-size:.72em;color:var(--ink2)}
.addr span{position:absolute;right:6px;transform:translateY(-50%);white-space:nowrap}
.mem{position:relative;border:2px solid var(--ink);background:var(--paper);height:100%}
.blk{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:.5em;border-top:2px solid var(--ink);overflow:hidden;text-align:center;line-height:1.1}
.blk:first-child{border-top:0}
.blk.so{background:var(--so);color:#fff;font-weight:600}
.blk.free{background:#fff;color:var(--ink2);outline:2px dashed #7d7d7d;outline-offset:-6px}
.blk.free .t{font-size:.85em}
.proc{color:#fff;font-weight:700}
.proc .L{font-size:1.25em}
.proc .S{font-family:var(--mono);font-size:.95em;font-weight:600}
.proc .N{font-size:.72em;font-weight:600;opacity:.95}
.proc.dark{color:#111}
.tag{font-size:.62em;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:#fff;color:#111;padding:0 .35em;border:1px solid #111}
/* partitions */
.part{position:absolute;left:0;right:0;border-top:2px solid var(--ink)}
.part:first-child{border-top:0}
.part .plabel{position:absolute;right:calc(100% + 3.6em);top:50%;transform:translateY(-50%)}
.part .occ{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:center;gap:.5em}
.part .waste{position:absolute;left:0;right:0;bottom:0;background:repeating-linear-gradient(135deg,#fff 0 6px,#f3c9c9 6px 9px);border-top:2px solid var(--waste);color:var(--waste);font-weight:700;font-size:.75em;display:flex;align-items:center;justify-content:center}
.part .pfree{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink2);outline:2px dashed #7d7d7d;outline-offset:-6px;font-size:.85em}
.pname{position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);font-size:.8em;white-space:nowrap;font-weight:700}
.pname small{display:block;font-weight:400;font-family:var(--mono);color:var(--ink2)}
/* highlight */
.scan{box-shadow:inset 0 0 0 5px var(--roxo)}
.scan::after{content:"examinando";position:absolute;top:2px;right:4px;font-size:.6em;font-weight:700;background:var(--roxo);color:#fff;padding:0 .3em}
.chosen{box-shadow:inset 0 0 0 4px var(--roxo),inset 0 0 0 8px var(--hl)}
.chosen::after{content:"escolhida";position:absolute;top:2px;right:4px;font-size:.6em;font-weight:700;background:var(--roxo);color:var(--hl);padding:0 .3em}
.closing{animation:closeFade 1.2s ease forwards}
.closing::before{content:"FECHADO";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#b00000;color:#fff;font-weight:800;letter-spacing:.12em;font-size:1.05em;z-index:3}
@keyframes closeFade{0%{opacity:1}65%{opacity:1}100%{opacity:.15}}
.target{outline:4px dashed var(--roxo)!important;outline-offset:-8px!important;background:repeating-linear-gradient(135deg,#fff 0 10px,#fff4cc 10px 14px)!important}
.target::after{content:attr(data-tlabel);position:absolute;top:4px;right:6px;font-size:.62em;font-weight:700;background:var(--roxo);color:var(--hl);padding:0 .35em}
.nofit::after{content:"não cabe";position:absolute;top:2px;right:4px;font-size:.6em;font-weight:700;background:var(--waste);color:#fff;padding:0 .3em}
/* queue */
.queue{display:flex;flex-direction:column;gap:1.5em;align-items:center;height:100%;overflow:hidden;padding-top:1.2em;padding-right:4px}
.qrow{position:absolute;left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;padding-right:4px}
.qrow .cards{grid-column:2;display:flex;gap:6px;align-items:center}
.qrow .empty{grid-column:2}
.qrow .arrow{font-size:1.2em;color:var(--ink2)}
.card{display:flex;align-items:center;gap:.45em;padding:.25em .55em;min-width:4.6em;justify-content:center;border:2px solid #111;position:relative}
.card .L{font-size:1.15em}
.card.wait{outline:3px solid var(--waste);outline-offset:2px}
.card .w{position:absolute;bottom:calc(100% + 2px);right:-2px;font-size:.58em;background:var(--waste);color:#fff;padding:0 .3em;font-weight:700;text-transform:uppercase;white-space:nowrap}
.empty{color:var(--ink2);font-size:.85em;font-style:italic}
/* side */
.side{display:flex;flex-direction:column;gap:12px;font-size:.88em}
.box{border:2px solid var(--ink);background:var(--paper);padding:8px 10px}
.box h3{margin:0 0 6px;font-size:.85em;text-transform:uppercase;letter-spacing:.06em}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--rule);padding:3px 6px;text-align:left;font-variant-numeric:tabular-nums}
th{font-size:.78em;text-transform:uppercase;color:var(--ink2)}
td.n{font-family:var(--mono)}
.disk{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.disk svg{width:64px;height:auto}
.diskcards{display:flex;flex-wrap:wrap;gap:6px;min-height:2.4em}
.legend{display:grid;gap:4px;font-size:.85em}
.legend i{display:inline-block;width:1.4em;height:.9em;vertical-align:middle;margin-right:.4em;border:1px solid #111}
.reg{font-family:var(--mono);font-size:.95em}
.reg b{font-size:1.2em}
.note{font-size:.8em;color:var(--ink2)}
/* bottom */
.bottom{display:grid;gap:10px;width:100%}
.msg{background:var(--paper);border:2px solid var(--roxo);border-left:10px solid var(--roxo);padding:.45em .8em;font-size:1.05em;min-height:2.9em;display:flex;align-items:center;gap:.8em}
.msg .step{font-family:var(--mono);font-size:.75em;background:var(--roxo);color:var(--hl);padding:.1em .4em;white-space:nowrap}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
.counters{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9em}
.counters div b{font-family:var(--mono);font-size:1.1em}
.counters .bad b{color:var(--waste)}
.ctrls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ctrls button{border:2px solid var(--roxo);background:var(--paper);color:var(--roxo);width:2.6em;height:2.1em;padding:0;border-radius:0;font-size:1.05em;display:flex;align-items:center;justify-content:center;line-height:1}
.ctrls button .d{font-size:.6em;font-weight:400;opacity:.85;white-space:nowrap}
.ctrls button.pri,.ctrls button.pri:hover:not(:disabled){background:var(--roxo);color:#fff;width:3.6em}
.ctrls button:disabled{opacity:.3;cursor:default}
.ctrls .kb{font-family:var(--mono);font-size:.62em;border:1px solid currentColor;padding:0 .3em;margin-left:.45em;vertical-align:.15em;opacity:.75}
.ctrls button[aria-pressed="true"],.ctrls button[aria-pressed="true"]:hover{background:var(--hl);color:var(--roxo);border-color:var(--roxo)}
/* modo Unix */
.hand{position:absolute;left:4px;top:3px;font-size:.6em;font-weight:800;background:var(--hl);color:var(--roxo);padding:0 .35em;border:1px solid var(--roxo);z-index:2}
.hand.h2{top:auto;bottom:3px;background:var(--roxo);color:var(--hl)}
.blk.linger{background:repeating-linear-gradient(135deg,#fff 0 8px,#ece6f3 8px 12px);color:var(--roxo);outline:2px dashed var(--roxo);outline-offset:-6px;font-weight:700}
.blk.linger{flex-direction:column;gap:0}.blk.linger .S{font-weight:600;font-size:.8em}
.users{display:flex;flex-direction:column;gap:14px;padding-top:.6em}
.ucard{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;border:2px solid #111;background:var(--paper);padding:.35em .6em;position:relative}
.ucard .sw{grid-row:span 2;width:1.1em;height:2.2em;border:1px solid #111}
.ucard .un{font-weight:700;font-size:1.05em}
.ucard .up{font-family:var(--mono);font-size:.8em;color:var(--ink2)}
.ucard .us{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:.62em;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:.1em .4em;border:1px solid #111;background:#fff}
.ucard.st-fora{opacity:.35}
.ucard.st-esperando{outline:3px solid var(--waste);outline-offset:2px}.ucard.st-esperando .us{background:var(--waste);color:#fff;border-color:var(--waste)}
.ucard.st-disco .us{background:#111;color:#fff}
.ucard.st-ativo .us{background:var(--roxo);color:var(--hl);border-color:var(--roxo)}
.cm td{padding:2px 6px;font-size:.92em}
.cm tr.lg td{color:var(--roxo);font-style:italic}
/* modo Windows x Unix */
.stage.wu{grid-template-columns:1fr 1fr;gap:34px}
.wuhalf{display:flex;flex-direction:column;min-height:0;min-width:0}
.wuhalf>h2{font-size:.85em;margin:0 0 8px;color:var(--roxo);font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-bottom:3px solid var(--roxo);padding-bottom:4px}
.wuhalf>h2 small{font-weight:600;color:var(--ink2);letter-spacing:.02em;text-transform:none;font-size:.9em}
.wubody{flex:1;min-height:0;display:grid;grid-template-columns:370px 1fr;gap:14px}
.wumem{position:relative;display:grid;grid-template-columns:2.4em 1fr;min-height:0}
.wumem .addr span{right:5px}
.wumem .blk{font-size:.9em;white-space:nowrap}
.wuside{display:flex;flex-direction:column;gap:10px;font-size:.82em;min-height:0}
.wuside table td,.wuside table th{padding:2px 5px}
.wunote{border:2px solid var(--roxo);border-left:8px solid var(--roxo);background:var(--paper);padding:8px 10px;font-size:1.3em;line-height:1.32;flex:1}
.wunote ul{margin:0;padding-left:1.1em}.wunote li{margin:0 0 3px}
.wuside .diskcards .card{font-size:.85em;min-width:0;padding:.15em .4em}
.lpm{background:repeating-linear-gradient(135deg,#fff 0 8px,#fde3c8 8px 12px)!important;outline-color:var(--C)!important;color:#7a3300!important}
/* v3.4 */
.pgroup{border:2px dashed var(--roxo);padding:.35em .45em .45em;display:flex;flex-direction:column;gap:.45em;align-items:center;background:#fff}
.pgroup .gh{font-size:.62em;font-weight:800;color:var(--roxo);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.wholecard{flex-direction:column;gap:.15em;padding:.4em .9em;min-width:7em}
.wholecard .cuts{display:flex;flex-direction:column;width:100%;margin-top:.2em}
.wholecard .cuts i{font-style:normal;font-family:var(--mono);font-size:.72em;padding:.35em 0;border-top:2px dashed #fff;text-align:center}
.col.side.pg table td,.col.side.pg table th{padding-top:1px;padding-bottom:1px}
.col.side.pg .diskcards .card{font-size:.85em}
.box.kw .ref{flex-basis:100%;margin-top:4px;border-left:6px solid var(--hl);padding:2px 8px;background:#f6f3f9}
.col.side.pg .disk svg{display:none}
.part.owned{outline:3px dashed var(--roxo);outline-offset:-3px}
.pname .own{display:block;font-style:normal;font-size:.85em;font-weight:800;color:#fff;background:var(--roxo);padding:0 .35em;margin-top:2px;width:max-content}
.pname .own.vaga{background:#fff;color:var(--ink2);border:1px dashed #7d7d7d;font-weight:600}
.col h2.qh{text-align:center}
.col h2.mh{padding-left:4em;text-align:center}
.col h2.mh.mhp{padding-right:8.125em}
.col h2 .vm{display:block;width:max-content;margin:3px auto 0;background:var(--hl);color:var(--roxo);padding:0 .5em;letter-spacing:.04em;font-weight:800}
.qrow .tie{grid-column:3;position:relative;margin-right:calc(-28px - 3.2em - 4px);border-top:3px dashed var(--roxo);height:0;align-self:center}
.qrow .tie::after{content:'';position:absolute;right:-2px;top:-8px;border:6px solid transparent;border-left:9px solid var(--roxo)}
.qrow .tie i{position:absolute;left:0;top:4px;font-style:normal;font-size:.6em;font-weight:700;color:var(--roxo);white-space:nowrap}
.box.kw{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;border:3px solid var(--roxo);padding:10px 12px}
.box.kw h3{flex-basis:100%;font-size:1.05em;color:var(--roxo);margin-bottom:4px}
.kwc{border:1px solid var(--roxo);color:var(--roxo);background:#fff;padding:.12em .5em;font-size:1.12em;font-weight:700}
.kwc.on{background:var(--hl);border-color:var(--hl);font-weight:800}
.col.side.pg .kwc,.col.side.ux .kwc{font-size:.95em}
.box.kw.focus{display:block;background:var(--hl);border:4px solid var(--roxo);padding:14px 16px;color:var(--roxo)}
.box.kw.focus h3{font-size:1.9em;letter-spacing:.04em;margin:0 0 6px}
.box.kw.focus .fdef{font-size:1.12em;font-weight:600;margin:0 0 10px;line-height:1.3;color:#111}
.box.kw.focus .fonus{font-size:1em;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.box.kw.focus ul{margin:0;padding-left:1.2em;font-size:1.12em;line-height:1.32;color:#111}
.box.kw.focus li{margin:0 0 6px}
.box.kw.focus .fsrc{margin:8px 0 0;font-size:.85em;color:var(--roxo);font-weight:600}
.msg.alert{background:var(--hl);border-color:var(--roxo);font-weight:700}
.ucard .un small{font-family:var(--mono);font-size:.7em;font-weight:600;color:var(--ink2);margin-left:.3em}
#anim{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.ctrls select{font:inherit;font-size:.85em;border:2px solid var(--ink);background:#fff;padding:.25em}
.ctrls label{font-size:.85em;display:flex;gap:4px;align-items:center}
.cstat{font-size:.85em;margin-top:6px;text-align:center}.cstat b{font-family:var(--mono)}
.disclaimer{font-size:.8em;background:#111;color:#fff;padding:.2em .6em;align-self:flex-start}
@media (max-width:820px){
  html,body{height:auto}body{overflow:auto;font-size:16px}.app{position:static;width:auto;height:auto;transform:none!important;padding:10px 16px}
  .stage,.stage.cmp{grid-template-columns:1fr;gap:16px}
  .colbody{height:420px;flex:none}
  .part .plabel{display:none}
}
</style>
</head><body>

<div class="app">
  <header>
    <h1>Simulador de Partições<small>Cap. 9 · Gerência de Memória</small></h1>
    <nav class="modes" id="modes" aria-label="Modos">
      <button id="m1" data-m="m1" title="Partição fixa absoluta (tecla 1)">Fixa absoluta</button>
      <button id="m2" data-m="m2" title="Partição fixa relocável (tecla 2)">Fixa relocável</button>
      <button id="m3" data-m="m3" title="Alocação dinâmica (tecla 3)">Dinâmica</button>
      <button id="m4" data-m="m4" title="First, Best e Worst-fit (tecla 4)">Estratégias</button>
      <button id="m5" data-m="m5" title="Swapping (tecla 5)">Swapping</button>
      <button id="m8" data-m="m8" title="Estudo de caso: as primeiras versões do Unix, com swapping (tecla U)">Estudo de Caso</button>
      <button id="m7" data-m="m7" title="Memória virtual: referência ao tema de outro grupo (tecla V)">Memória Virtual</button>
    </nav>
    <div class="sub" id="strat" hidden>
      <button id="s-first" data-s="first" title="A primeira área que cabe">First-fit</button>
      <button id="s-best" data-s="best" title="A menor área que cabe">Best-fit</button>
      <button id="s-worst" data-s="worst" title="A maior área">Worst-fit</button>
      <button id="s-cmp" data-s="cmp" title="As três lado a lado">Comparar</button>
    </div>
  </header>

  <main class="stage" id="stage"></main>

  <div class="bottom">
    <div class="msg" role="status" aria-live="polite"><span class="step" id="stepn"></span><span id="msg"></span></div>
    <div class="bar">
      <div class="counters" id="counters"></div>
      <div class="ctrls">
        <button id="bBack" title="Voltar (seta esquerda)" aria-label="Voltar"><svg viewBox="0 0 24 24" width="1.1em" height="1.1em" aria-hidden="true"><path d="M15 5 7 12l8 7z" fill="currentColor"/><rect x="4" y="5" width="2.6" height="14" fill="currentColor"/></svg></button>
        <button id="bNext" class="pri" title="Próximo (seta direita)" aria-label="Próximo"><svg viewBox="0 0 24 24" width="1.1em" height="1.1em" aria-hidden="true"><path d="M9 5l8 7-8 7z" fill="currentColor"/><rect x="17.4" y="5" width="2.6" height="14" fill="currentColor"/></svg></button>
        <button id="bPlay" title="Reproduzir / pausar (espaço)" aria-label="Reproduzir" aria-pressed="false"><svg viewBox="0 0 24 24" width="1.1em" height="1.1em" aria-hidden="true"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg></button>
        <button id="bReset" title="Recomeçar (R)" aria-label="Recomeçar"><svg viewBox="0 0 24 24" width="1.1em" height="1.1em" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.6 4.7" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M3 4v7h7z" fill="currentColor"/></svg></button>
        <button id="bFull" title="Tela cheia (F)" aria-label="Tela cheia" aria-pressed="false"><svg viewBox="0 0 24 24" width="1.1em" height="1.1em" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.6"/></svg></button>
        <input type="checkbox" id="anim" checked aria-hidden="true" tabindex="-1">
      </div>
    </div>
  </div>
</div>

<script>
/* ---------------- programas ---------------- */
const PROG = {
  A:{L:'A',c:'--A'}, B:{L:'B',c:'--B'}, C:{L:'C',c:'--C'}, D:{L:'D',c:'--D'}, E:{L:'E',c:'--E'}, F:{L:'F',c:'--F'},

/* ---------------- memória dinâmica: helpers ---------------- */
function dynFree(mem){return mem.filter(b=>!b.p);}
function choose(mem,size,s){
  const scan=[];let c=-1;
  mem.forEach((b,i)=>{ if(b.p) return; scan.push(b.s); if(b.z<size) return;
    if(s==='first'){ if(c<0) c=i; }
    else if(c<0 || (s==='best'? b.z<mem[c].z : b.z>mem[c].z)) c=i; });
  if(s==='first' && c>=0){ const k=scan.indexOf(mem[c].s); scan.length=k+1; }
  return {scan, idx:c};
}
function place(mem,idx,p,size){
  const b=mem[idx], out=clone(mem); const parts=[{s:b.s,z:size,p}];
  if(b.z>size) parts.push({s:b.s+size,z:b.z-size,p:null});
  out.splice(idx,1,...parts); return out;
}
function release(mem,p){
  const m=clone(mem).map(b=>b.p===p?{...b,p:null,st:undefined}:b); const r=[]; let j=0;
  for(const b of m){const l=r[r.length-1]; if(l&&!l.p&&!b.p){l.z+=b.z;j++;} else r.push(b);} return {mem:r,joins:j};
}
function compact(mem,total){
  let a=0; const out=[]; mem.filter(b=>b.p).forEach(b=>{out.push({...b,s:a}); a+=b.z;});
  if(a<total) out.push({s:a,z:total-a,p:null}); return out;
}

function flip(prev){
  if(!animOn()||!prev) return;
  document.querySelectorAll('#stage [data-pid]').forEach(e=>{ const a=prev[e.dataset.pid]; if(!a) return; const b=e.getBoundingClientRect();
    const S=window.__scale||1, dx=(a.left-b.left)/S, dy=(a.top-b.top)/S; if(Math.abs(dx)<2&&Math.abs(dy)<2) return;
    const sx=a.width/b.width, sy=a.height/b.height;

  const bp=document.getElementById('bPlay'); bp.innerHTML='<svg viewBox="0 0 24 24" width="1.1em" height="1.1em" aria-hidden="true"><rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/></svg>'; bp.setAttribute('aria-pressed','true');
  playing=setInterval(()=>{ if(busy) return; if(step>=nSteps()-1){stop();return;} go(1); }, 2600); }
document.getElementById('modes').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) setMode(b.dataset.m);});
document.getElementById('strat').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; stop();
  if(b.dataset.s==='cmp'){ cmp=!cmp; } else { cmp=false; strat=b.dataset.s; } step=0; build(); render(); });
document.getElementById('bBack').onclick=()=>go(-1);
document.getElementById('bNext').onclick=()=>go(1);
document.getElementById('bPlay').onclick=play;
document.getElementById('bReset').onclick=()=>{stop();step=0;render();};
function full(){ try{ if(!document.fullscreenElement){ const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); p&&p.catch&&p.catch(()=>{}); } else document.exitFullscreen(); }catch(_){} }
document.getElementById('bFull').onclick=full;
document.addEventListener('fullscreenchange',()=>{ document.getElementById('bFull').setAttribute('aria-pressed',!!document.fullscreenElement); });
document.addEventListener('keydown',e=>{
  if(e.target.closest('select,input')) return;
  if(e.ctrlKey||e.metaKey||e.altKey) return; // Ctrl+C, Ctrl+V etc. ficam com o navegador
  const k=e.key.toLowerCase();
  if(k==='arrowright'){e.preventDefault();stop();go(1);} else if(k==='arrowleft'){e.preventDefault();stop();go(-1);}
  else if(k===' '){e.preventDefault();play();} else if(k==='r'){stop();step=0;render();} else if(k==='f'){full();}
  else if('12345'.includes(k)&&k.length===1){setMode('m'+k);} else if(k==='w'||k==='v'){setMode('m7');} else if(k==='u'){setMode('m8');}
  else if(mode==='m4'&&k==='s'){ const o=['first','best','worst']; cmp=false; strat=o[(o.indexOf(strat)+1)%3]; step=0; build(); render(); }
});

function fit(){ const app=document.querySelector('.app');
  if(innerWidth<820){ window.__scale=1; app.style.transform='none'; return; }
  const s=Math.min(innerWidth/1600, innerHeight/900); window.__scale=s;
  app.style.transform=`translate(${(innerWidth-1600*s)/2}px,${(innerHeight-900*s)/2}px) scale(${s})`; }
fit();
let rz; window.addEventListener('resize',()=>{ fit(); clearTimeout(rz); rz=setTimeout(()=>{ if(!busy) render(); },150);});
document.addEventListener('fullscreenchange',()=>setTimeout(fit,50));
build(); render();
</script>
